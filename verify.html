<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FANTASTIC — Ticket Verification</title><link rel="stylesheet" href="ticket.css"><style>body{margin:0;background:#09070b;color:#fff;font-family:Arial,sans-serif}.verify-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.verify-card{width:min(560px,100%);background:#130d17;border:1px solid #3b3043;border-radius:22px;padding:28px;box-sizing:border-box}.verify-card img{width:190px;max-height:52px;object-fit:contain}.verify-card h1{font-size:38px;margin:24px 0 8px}.verify-card p{color:#aaa}.scan{background:#09070b;border:1px solid #39263f;border-radius:16px;overflow:hidden;margin:22px 0}.manual{display:flex;gap:8px}.manual input{flex:1;background:#0b090d;color:#fff;border:1px solid #3b3043;border-radius:10px;padding:13px;font-size:16px}.manual button{border:0;border-radius:10px;padding:0 18px;background:#b86cff;color:#fff;font-weight:700}.result{margin-top:18px;padding:18px;border-radius:14px;display:none}.valid{display:block;background:#102518;border:1px solid #36b36a}.used{display:block;background:#2b2110;border:1px solid #d49a38}.invalid{display:block;background:#2b1115;border:1px solid #d34d5b}.result h2{margin:0 0 10px}.result p{margin:7px 0}.use{margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#36b36a;color:#fff;font-weight:700;cursor:pointer}</style></head><body><div class="verify-wrap"><main class="verify-card"><img src="logo.png" alt="FANTASTIC"><h1>Ticket Verification</h1><p>Scan the customer's QR code to verify entry.</p><div id="reader" class="scan"></div><div class="manual"><input id="ticketId" placeholder="Enter Ticket ID e.g. FAN12345678"><button id="verifyBtn">VERIFY</button></div><div id="result" class="result"></div></main></div><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script>
const result=document.getElementById('result'), input=document.getElementById('ticketId');
function show(cls,html){result.className='result '+cls;result.innerHTML=html}
async function verify(id){id=String(id||'').trim();if(!id)return;input.value=id;try{const r=await fetch('/api/verify-ticket?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.valid){show('invalid','<h2>✕ INVALID PASS</h2><p>'+(d.error||'Ticket not found.')+'</p>');return}if(d.used){show('used','<h2>⚠ ALREADY USED</h2><p><b>Ticket ID:</b> '+d.bookingId+'</p><p><b>Holder:</b> '+d.holderName+'</p><p><b>Pass:</b> '+d.passType+'</p><p><b>Quantity:</b> '+d.quantity+'</p>');return}show('valid','<h2>✓ VALID PASS</h2><p><b>Ticket ID:</b> '+d.bookingId+'</p><p><b>Holder:</b> '+d.holderName+'</p><p><b>Pass:</b> '+d.passType+'</p><p><b>Quantity:</b> '+d.quantity+'</p><button class="use" onclick="useTicket(\''+d.bookingId+'\')">VERIFY ENTRY / MARK USED</button>')}catch(e){show('invalid','<h2>Verification error</h2><p>Please try again.</p>')}}
async function useTicket(id){const r=await fetch('/api/use-ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:id})});const d=await r.json();if(r.ok&&d.success)show('valid','<h2>✓ ENTRY VERIFIED</h2><p><b>Ticket ID:</b> '+d.booking_id+'</p><p><b>Holder:</b> '+d.holder_name+'</p><p><b>Pass:</b> '+d.pass_type+'</p><p><b>Quantity:</b> '+d.quantity+'</p><p><b>Status:</b> USED</p>');else show('used','<h2>⚠ ENTRY NOT ALLOWED</h2><p>'+(d.error||'Ticket already used.')+'</p>')}
document.getElementById('verifyBtn').onclick=()=>verify(input.value);
new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:250}},false).render(text=>{const parts=text.split('|');const id=parts.find(x=>/^FAN\d{6,}$/.test(x));verify(id||text)});
</script></body></html>
