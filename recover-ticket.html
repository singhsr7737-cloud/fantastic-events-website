<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recover Your Ticket | FANTASTIC Events</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#100b15;color:#fff;font-family:Arial,sans-serif}.card{width:min(520px,100%);padding:30px;border:1px solid #6f4388;border-radius:20px;background:linear-gradient(145deg,#21122b,#110d16);box-shadow:0 20px 70px #0008}.eyebrow{color:#d78cff;letter-spacing:2px;font-size:11px}h1{font-size:34px;margin:10px 0}p{color:#d4c8dc;line-height:1.6}label{display:block;margin:16px 0 7px;font-size:13px}input{width:100%;padding:14px;border:1px solid #55435f;border-radius:9px;background:#0c0910;color:#fff;font-size:16px}button,.back{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:9px;background:#b86cff;color:#180d20;font-weight:700;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}.back{background:transparent;border:1px solid #55435f;color:#fff}#status{margin-top:16px;white-space:pre-wrap;font-size:14px}</style></head><body><main class="card"><div class="eyebrow">FANTASTIC EVENTS · GARBA रास-रंग 18</div><h1>Recover My Ticket</h1><p>Ticket PDF dobara email karne ke liye apna Booking ID aur booking ke waqt diya hua email address enter karein.</p><form id="recoverForm"><label for="bookingId">Booking ID</label><input id="bookingId" name="bookingId" placeholder="Example: FAN12345678" required maxlength="30" autocomplete="off"><label for="email">Registered Email Address</label><input id="email" name="email" type="email" placeholder="you@example.com" required maxlength="120" autocomplete="email"><button type="submit" id="submitBtn">EMAIL MY TICKET PDF</button></form><div id="status" role="status" aria-live="polite"></div><a class="back" href="/">Back to FANTASTIC Events</a></main><script>const form=document.getElementById('recoverForm'),statusEl=document.getElementById('status'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending…';statusEl.textContent='Please wait…';try{const r=await fetch('/api/recover-ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:document.getElementById('bookingId').value.trim(),email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send ticket right now.');statusEl.textContent=d.message||'If matching details are found, the ticket will be emailed.';}catch(err){statusEl.textContent=err.message||'Unable to send ticket. Please contact FANTASTIC Events.';}finally{btn.disabled=false;btn.textContent='EMAIL MY TICKET PDF';}});</script></body></html>
